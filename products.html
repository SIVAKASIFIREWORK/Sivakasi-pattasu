<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Sivakasi Pattasu</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🎆 Sivakasi Pattasu</h1>

<nav>

<a href="./index.html">Home</a>
  <a href="./products.html">Products</a>
<a href="./cart.html">Cart (<span id="cartCount">0</span>)</a>
  
</nav>

</header>

<section class="products">

<h2>All Products</h2>
  
<input
type="text"
id="searchBox"
placeholder="🔍 Search Products..."
onkeyup="searchProducts()">
  
  <select id="categoryFilter" onchange="filterProducts()">
    <option value="All">All Categories</option>
    <option value="Sparklers">Sparklers</option>
    <option value="Flower Pots">Flower Pots</option>
    <option value="Rockets">Rockets</option>
    <option value="Bombs">Bombs</option>
    <option value="Gift Boxes">Gift Boxes</option>
  </select>
  
<div id="products"></div>

</section>
  <script src="js/products.js"></script>
  <script>
console.log("Products page loaded");
  </script>
  
  <!-- Product Image Preview -->
<div id="imageViewer"
     style="display:none; position:fixed; inset:0;
     background:rgba(0,0,0,0.85); z-index:9999;
     justify-content:center; align-items:center;
     flex-direction:column; padding:20px;">

    <button
        onclick="document.getElementById('imageViewer').style.display='none'"
        style="position:absolute; top:20px; right:20px;
        font-size:28px; padding:5px 15px; cursor:pointer;">
        ✕
    </button>

    <h3 id="previewTitle" style="color:white;">Product Preview</h3>

    <img id="previewImage" src="images/placeholder.png" alt="Product Image">
         style="max-width:90%; max-height:75vh;
         object-fit:contain;">
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- Firebase Config -->
<script src="js/firebase.js"></script>

<!-- ⭐ ITHU THAAN MUKKIYAM - IDHA ADD PANNUNGA -->
<script src="js/products-data.js"></script>

<!-- Products Logic -->
<script src="js/products.js"></script>

</body>
</html>
