<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Upload Products</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="js/firebase.js"></script>
<script src="js/products-data.js"></script>
</head>
<body>
<h1>Upload 80 Products</h1>
<button id="uploadBtn">Upload Now</button>
<div id="status"></div>
<script>
document.getElementById("uploadBtn").addEventListener("click", function(){
    const status = document.getElementById("status");
    if(typeof window.productsData === "undefined"){
        status.innerHTML = "❌ products-data.js not loaded";
        return;
    }
    status.innerHTML = "⏳ Uploading...";
    // Object ஆக மாற்றுதல் - main fix
    const obj = {};
    window.productsData.forEach(p => { obj[p.id] = p; });
    
    console.log("Before Upload");
console.log(window.products);
    firebase.database().ref("products").set(obj)
    .then(()=> status.innerHTML = "✅ 80 Products Uploaded! products.html check பண்ணுங்க")
    .catch(e=> status.innerHTML = "❌ "+e.message);
});
</script>
</body>
</html>
