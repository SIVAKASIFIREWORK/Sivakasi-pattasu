<section class="products">

<h2>Product Management</h2>

<p>Select a product and update it.</p>

<select id="productSelect">
<option value="">-- Select Product --</option>
</select>

<br><br>

<input
type="text"
id="productName"
placeholder="Product Name">

<br><br>

<input
type="number"
id="productPrice"
placeholder="Product Price">

<br><br>

<input
type="text"
id="productImage"
placeholder="Image Path (Example: images/rocket.jpg)">

<br><br>
<button id="saveBtn">
💾 Save Changes
</button>

  <div id="status"></div>
<div id="productList"></div>

</section>
