<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Sivakasi Pattasu</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .cart-actions a,
        .cart-actions button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border: none;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
        }

        .continue-shopping {
            background: #444;
            color: white;
        }

        .whatsapp-order {
            background: #25D366;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Shopping Cart</h1>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./products.html">Products</a>
        <a href="./cart.html">Cart (<span id="cartCount">0</span>)</a>
    </nav>
</header>

<section class="products">

    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <h3 id="totalPrice">Total: ₹0</h3>

    <div class="cart-actions">

        <a href="./products.html" class="continue-shopping">
            🛍️ Continue Shopping
        </a>

        <button
            type="button"
            class="whatsapp-order"
            onclick="orderViaWhatsApp()">
            🟢 Order via WhatsApp
        </button>

    </div>

</section>

<script src="./cart.js"></script>
<script src="./header.js"></script>

<script>
function orderViaWhatsApp() {

    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Your cart is empty! Please add products first.");
        return;
    }

    let message = "🧨 *SIVAKASI PATTASU - NEW ORDER* 🧨\n\n";
    let total = 0;

    cart.forEach(function(item, index) {

        const name = item.name || item.productName || "Product";
        const price = Number(item.price) || 0;
        const qty = Number(item.qty || item.quantity) || 1;
        const subtotal = price * qty;

        total += subtotal;

        message += (index + 1) + ". " + name + "\n";
        message += "   Price: ₹" + price + "\n";
        message += "   Quantity: " + qty + "\n";
        message += "   Subtotal: ₹" + subtotal + "\n\n";
    });

    message += "💰 *Total: ₹" + total + "*\n\n";
    message += "Please confirm my order.";

    // Replace this with your WhatsApp number:
    // Country code + phone number, digits only.
    const whatsappNumber = "918220216784";

    const whatsappURL =
        "https://wa.me/" + whatsappNumber +
        "?text=" + encodeURIComponent(message);

    window.open(whatsappURL, "_blank");
}
</script>

</body>
</html>
